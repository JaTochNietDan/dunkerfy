[package]
name = "dunkerfy"
version = "0.2.1"
edition = "2021"
rust-version = "1.99"
description = "Native macOS notification sound rules, written in Rust"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
